name: Build Clang Toolchain

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: 'LLVM version to build (e.g. 22.1.3)'
        required: true
        default: '22.1.3'
  workflow_call:
    inputs:
      llvm_version:
        description: 'LLVM version to build'
        required: true
        type: string

env:
  LLVM_VERSION: ${{ inputs.llvm_version }}
  JOBS: 4

# Every job runs in the build-environment image (build-env/Dockerfile), pinned by digest, so the
# host tools change only when the digest here does. Pulling it from GHCR needs packages: read.
permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # Phase 1: Build stage1 host clang/lld/lldb (musl, fully static).
  # Single job — must finish before any per-arch lane can start.
  # ---------------------------------------------------------------------------
  host-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    container:
      image: ghcr.io/jakesays/clang-builder-env@sha256:91a236373e201ec5c62e154710460504110679720f348283d2da424e80bd8d8d
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # LFS pull only needed for prebuilts; skip it on stage1 cache hit.
          lfs: false

      # The key includes the image digest, so a new build environment never reuses a stage1 built
      # in the old one.
      - name: Restore stage1 cache
        id: stage1-cache
        uses: actions/cache@v4
        with:
          path: ci-artifacts/install-stage1.tar.gz
          key: stage1-${{ inputs.llvm_version }}-env-91a236373e20

      - name: Pull LFS prebuilts
        if: steps.stage1-cache.outputs.cache-hit != 'true'
        run: git lfs pull

      - name: Build stage1 host
        if: steps.stage1-cache.outputs.cache-hit != 'true'
        run: |
          "$GITHUB_WORKSPACE/prebuilts/clang-builder" build \
            --llvm-version "$LLVM_VERSION" \
            --all \
            --prebuilts-dir "$GITHUB_WORKSPACE/prebuilts" \
            --work-dir      "$RUNNER_TEMP/toolchain-work" \
            --output-dir    "$GITHUB_WORKSPACE" \
            --jobs          "$JOBS" \
            --build-target  stage1 \
            --keep-work-dir

      - name: Pack stage1 install
        if: steps.stage1-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-artifacts"
          cd "$RUNNER_TEMP/toolchain-work"
          tar --owner=0 --group=0 -czf "$GITHUB_WORKSPACE/ci-artifacts/install-stage1.tar.gz" \
            "clang-${LLVM_VERSION}-linux-x86_64"

      - name: Upload stage1 install
        uses: actions/upload-artifact@v4
        with:
          name: install-stage1
          path: ci-artifacts/install-stage1.tar.gz
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Phase 2: 10-way matrix — runtimes (rt + libcxx + sanitizers) per
  # (arch, libc); musl lanes also build that arch's lldb-server.
  # All lanes are fully independent and write to disjoint triple-named dirs.
  # ---------------------------------------------------------------------------
  matrix-build:
    needs: host-stage
    runs-on: ubuntu-latest
    timeout-minutes: 350
    container:
      image: ghcr.io/jakesays/clang-builder-env@sha256:91a236373e201ec5c62e154710460504110679720f348283d2da424e80bd8d8d
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,     libc: glibc, targets: "rt-glibc,libcxx-glibc,san-glibc" }
          - { arch: armv7,   libc: glibc, targets: "rt-glibc,libcxx-glibc,san-glibc" }
          - { arch: aarch64, libc: glibc, targets: "rt-glibc,libcxx-glibc,san-glibc" }
          - { arch: riscv64, libc: glibc, targets: "rt-glibc,libcxx-glibc,san-glibc" }
          - { arch: x32,     libc: glibc, targets: "rt-glibc,libcxx-glibc,san-glibc" }
          - { arch: x64,     libc: musl,  targets: "rt-musl,libcxx-musl,san-musl,lldb-server" }
          - { arch: armv7,   libc: musl,  targets: "rt-musl,libcxx-musl,san-musl,lldb-server" }
          - { arch: aarch64, libc: musl,  targets: "rt-musl,libcxx-musl,san-musl,lldb-server" }
          - { arch: riscv64, libc: musl,  targets: "rt-musl,libcxx-musl,san-musl,lldb-server" }
          - { arch: x32,     libc: musl,  targets: "rt-musl,libcxx-musl,san-musl,lldb-server" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore stage1 install
        uses: actions/download-artifact@v4
        with:
          name: install-stage1
          path: ci-artifacts/stage1

      - name: Unpack stage1 install
        run: |
          mkdir -p "$RUNNER_TEMP/toolchain-work"
          tar -xpzf "$GITHUB_WORKSPACE/ci-artifacts/stage1/install-stage1.tar.gz" \
            -C "$RUNNER_TEMP/toolchain-work"

      - name: Build lane (${{ matrix.arch }}-${{ matrix.libc }})
        run: |
          "$GITHUB_WORKSPACE/prebuilts/clang-builder" build \
            --llvm-version "$LLVM_VERSION" \
            --${{ matrix.arch }} \
            --prebuilts-dir "$GITHUB_WORKSPACE/prebuilts" \
            --work-dir      "$RUNNER_TEMP/toolchain-work" \
            --output-dir    "$GITHUB_WORKSPACE" \
            --jobs          "$JOBS" \
            --build-target  "${{ matrix.targets }}" \
            --lane-diff     "$GITHUB_WORKSPACE/ci-artifacts/install-lane.tar.gz" \
            --keep-work-dir

      - name: Upload lane diff
        uses: actions/upload-artifact@v4
        with:
          name: install-lane-${{ matrix.arch }}-${{ matrix.libc }}
          path: ci-artifacts/install-lane.tar.gz
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Phase 3: Merge per-lane diffs onto stage1, test and package the toolchain,
  # and publish a GitHub release.
  #
  # NOTE: liblldb.so is intentionally NOT built here yet — Python support for
  # liblldb (needed by CLion) is pending. To re-enable, add a
  # `clang-builder build ... --build-target liblldb --keep-work-dir` step
  # before the package step below.
  # ---------------------------------------------------------------------------
  merge-and-final:
    needs: matrix-build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/jakesays/clang-builder-env@sha256:91a236373e201ec5c62e154710460504110679720f348283d2da424e80bd8d8d
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write   # required to create GitHub releases
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download all lane artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: install-*
          path: ci-artifacts

      - name: Assemble merged install
        run: |
          INSTALL_DIR="$RUNNER_TEMP/toolchain-work/clang-${LLVM_VERSION}-linux-x86_64"
          mkdir -p "$RUNNER_TEMP/toolchain-work"
          tar -xpzf "$GITHUB_WORKSPACE/ci-artifacts/install-stage1/install-stage1.tar.gz" \
            -C "$RUNNER_TEMP/toolchain-work"
          for lane in "$GITHUB_WORKSPACE/ci-artifacts"/install-lane-*; do
            tar -xpzf "$lane/install-lane.tar.gz" -C "$INSTALL_DIR/"
          done

      - name: Run toolchain tests
        run: |
          "$GITHUB_WORKSPACE/prebuilts/clang-builder" build \
            --llvm-version "$LLVM_VERSION" \
            --all \
            --prebuilts-dir "$GITHUB_WORKSPACE/prebuilts" \
            --work-dir "$RUNNER_TEMP/toolchain-work" \
            --output-dir "$GITHUB_WORKSPACE" \
            --jobs "$JOBS" \
            --run-tests-only \
            --keep-work-dir

      - name: Package toolchain
        run: |
          "$GITHUB_WORKSPACE/prebuilts/clang-builder" build \
            --llvm-version "$LLVM_VERSION" \
            --all \
            --prebuilts-dir "$GITHUB_WORKSPACE/prebuilts" \
            --work-dir      "$RUNNER_TEMP/toolchain-work" \
            --output-dir    "$GITHUB_WORKSPACE" \
            --jobs          "$JOBS" \
            --package-only \
            --keep-work-dir

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "clang-${LLVM_VERSION}" \
            --repo JakeSays/clang-releases \
            --title "Clang ${LLVM_VERSION} Linux x86_64" \
            --notes "Clang/LLD/LLDB ${LLVM_VERSION} cross-compilation toolchain for Linux x86_64." \
            "clang-${LLVM_VERSION}-linux-x86_64.tar.zst" \
            "clang+llvm-${LLVM_VERSION}-linux-x86_64-musl-dev.tar.zst" \
            "clang-${LLVM_VERSION}-linux-x86_64-symbols.tar.zst"
